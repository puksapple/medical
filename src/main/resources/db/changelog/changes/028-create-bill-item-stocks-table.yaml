databaseChangeLog:
  - changeSet:
      id: 028-create-bill-item-stocks-table
      author: puks

      changes:
        - createTable:
            tableName: bill_item_stocks

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: bill_item_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: medicine_stock_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: quantity_used
                  type: INT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: bill_item_stocks
            baseColumnNames: bill_item_id
            referencedTableName: bill_items
            referencedColumnNames: id
            constraintName: fk_bill_item_stock_bill_item

        - addForeignKeyConstraint:
            baseTableName: bill_item_stocks
            baseColumnNames: medicine_stock_id
            referencedTableName: medicine_stocks
            referencedColumnNames: id
            constraintName: fk_bill_item_stock_medicine_stock