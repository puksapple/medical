databaseChangeLog:
  - changeSet:
      id: 029-add-unit-fields-to-medicines-table
      author: puks

      changes:
        - addColumn:
            tableName: medicines
            columns:
              - column:
                  name: base_unit
                  type: VARCHAR(50)

              - column:
                  name: pack_unit
                  type: VARCHAR(50)

              - column:
                  name: units_per_pack
                  type: INT